<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="fur" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFFFFF"/>
<stop offset="100%" stop-color="#F2F2F2"/>
</linearGradient>

<linearGradient id="pink" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFB6D9"/>
<stop offset="100%" stop-color="#FF69B4"/>
</linearGradient>

<linearGradient id="carrot" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FFA726"/>
<stop offset="100%" stop-color="#F57C00"/>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="8" stdDeviation="10"
flood-color="#000"
flood-opacity=".25"/>
</filter>

</defs>

<g filter="url(#shadow)">

<!-- Left Ear -->
<ellipse cx="175" cy="95" rx="28" ry="90" fill="url(#fur)"/>
<ellipse cx="175" cy="95" rx="12" ry="62" fill="url(#pink)"/>

<!-- Right Ear -->
<ellipse cx="337" cy="95" rx="28" ry="90" fill="url(#fur)"/>
<ellipse cx="337" cy="95" rx="12" ry="62" fill="url(#pink)"/>

<!-- Head -->
<circle cx="256" cy="185" r="110" fill="url(#fur)"/>

<!-- Eyes -->
<ellipse cx="220" cy="180" rx="12" ry="18" fill="#222"/>
<ellipse cx="292" cy="180" rx="12" ry="18" fill="#222"/>

<circle cx="224" cy="173" r="4" fill="#FFF"/>
<circle cx="296" cy="173" r="4" fill="#FFF"/>

<!-- Nose -->
<ellipse cx="256" cy="210" rx="10" ry="7" fill="#FF69B4"/>

<!-- Smile -->
<path d="M240 220 Q256 238 272 220"
stroke="#444"
stroke-width="5"
fill="none"
stroke-linecap="round"/>

<!-- Cheeks -->
<circle cx="190" cy="210" r="16" fill="#FFD6E8" opacity=".75"/>
<circle cx="322" cy="210" r="16" fill="#FFD6E8" opacity=".75"/>

<!-- Bow -->
<ellipse cx="170" cy="125" rx="20" ry="14" fill="url(#pink)"/>
<ellipse cx="210" cy="125" rx="20" ry="14" fill="url(#pink)"/>
<circle cx="190" cy="125" r="10" fill="#FF3D7F"/>

<!-- Body -->
<ellipse cx="256" cy="370" rx="105" ry="92" fill="url(#fur)"/>

<!-- Belly -->
<ellipse cx="256" cy="375" rx="48" ry="58" fill="#FAFAFA"/>

<!-- Arms -->
<circle cx="170" cy="330" r="28" fill="url(#fur)"/>
<circle cx="342" cy="330" r="28" fill="url(#fur)"/>

<!-- Legs -->
<ellipse cx="205" cy="470" rx="28" ry="18" fill="url(#fur)"/>
<ellipse cx="307" cy="470" rx="28" ry="18" fill="url(#fur)"/>

<!-- Carrot -->
<path d="M250 320
L275 390
L235 390Z"
fill="url(#carrot)"/>

<path d="M250 315
L242 300
M256 315
L256 296
M262 315
L270 300"
stroke="#4CAF50"
stroke-width="6"
stroke-linecap="round"/>

</g>

</svg>
