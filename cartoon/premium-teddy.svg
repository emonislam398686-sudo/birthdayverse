<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">

<defs>

<linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#D8A16B"/>
<stop offset="100%" stop-color="#A66A3F"/>
</linearGradient>

<linearGradient id="heart" x1="0" y1="0" x2="1" y2="1">
<stop offset="0%" stop-color="#FF7BA5"/>
<stop offset="100%" stop-color="#FF2F74"/>
</linearGradient>

<filter id="shadow">
<feDropShadow dx="0" dy="8" stdDeviation="10"
flood-color="#000" flood-opacity=".25"/>
</filter>

</defs>

<g filter="url(#shadow)">

<!-- ears -->
<circle cx="140" cy="110" r="45" fill="url(#body)"/>
<circle cx="372" cy="110" r="45" fill="url(#body)"/>

<circle cx="140" cy="110" r="22" fill="#F8D7B5"/>
<circle cx="372" cy="110" r="22" fill="#F8D7B5"/>

<!-- head -->
<circle cx="256" cy="170" r="120" fill="url(#body)"/>

<!-- eyes -->
<circle cx="215" cy="160" r="10" fill="#222"/>
<circle cx="297" cy="160" r="10" fill="#222"/>

<circle cx="218" cy="156" r="3" fill="#fff"/>
<circle cx="300" cy="156" r="3" fill="#fff"/>

<!-- cheeks -->
<circle cx="180" cy="195" r="14"
fill="#FFC8D5" opacity=".7"/>

<circle cx="332" cy="195" r="14"
fill="#FFC8D5" opacity=".7"/>

<!-- nose -->
<ellipse cx="256" cy="190"
rx="13"
ry="10"
fill="#333"/>

<!-- smile -->
<path d="M235 212
Q256 228
277 212"
stroke="#333"
stroke-width="5"
fill="none"
stroke-linecap="round"/>

<!-- body -->
<ellipse cx="256"
cy="355"
rx="120"
ry="105"
fill="url(#body)"/>

<!-- belly -->
<ellipse cx="256"
cy="360"
rx="58"
ry="72"
fill="#F8D7B5"/>

<!-- hands -->
<circle cx="150"
cy="325"
r="35"
fill="url(#body)"/>

<circle cx="362"
cy="325"
r="35"
fill="url(#body)"/>

<!-- feet -->
<ellipse cx="195"
cy="465"
rx="34"
ry="26"
fill="url(#body)"/>

<ellipse cx="317"
cy="465"
rx="34"
ry="26"
fill="url(#body)"/>

<!-- heart -->

<path
d="
M256 315
C238 286 192 294 192 332
C192 365 256 405 256 405
C256 405 320 365 320 332
C320 294 274 286 256 315Z"
fill="url(#heart)"/>

</g>

</svg>
