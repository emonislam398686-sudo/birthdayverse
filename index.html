<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎉</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      overflow-x: hidden;
    }

    .card-container {
      background: rgba(255, 255, 255, 0.45);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.6);
      border-radius: 24px;
      padding: 40px 30px;
      text-align: center;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(255, 105, 180, 0.2);
      transition: transform 0.3s ease;
    }

    .card-container:hover {
      transform: translateY(-5px);
    }

    .svg-icon {
      margin-bottom: 15px;
      filter: drop-shadow(0 10px 15px rgba(255, 71, 87, 0.3));
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }

    h1 {
      color: #d63031;
      font-size: 28px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    p {
      color: #4a4a4a;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    .btn {
      background: linear-gradient(45deg, #ff4757, #ff6b81);
      color: #fff;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: 600;
      border-radius: 30px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 71, 87, 0.4);
      transition: all 0.3s ease;
    }

    .btn:hover {
      background: linear-gradient(45deg, #ff6b81, #ff4757);
      transform: scale(1.05);
      box-shadow: 0 12px 25px rgba(255, 71, 87, 0.5);
    }
  </style>
</head>
<body>

  <div class="card-container">
    <!-- Premium 3D Glowing Heart SVG -->
    <div class="svg-icon">
      <svg width="150" height="150" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="heartGlow" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff4757" />
            <stop offset="100%" stop-color="#ff7eb3" />
          </linearGradient>
          <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
            <feGaussianBlur stdDeviation="6" result="blur" />
            <feComposite in="SourceGraphic" in2="blur" operator="over" />
          </filter>
        </defs>
        <!-- Glass Wings -->
        <path d="M 30 90 Q 0 50 40 30 Q 70 60 90 90 Z" fill="rgba(255, 255, 255, 0.7)"/>
        <path d="M 170 90 Q 200 50 160 30 Q 130 60 110 90 Z" fill="rgba(255, 255, 255, 0.7)"/>
        <!-- Glowing Heart -->
        <path d="M 100 160 C 20 100, 30 40, 70 40 C 90 40, 100 60, 100 60 C 100 60, 110 40, 130 40 C 170 40, 180 100, 100 160 Z" 
              fill="url(#heartGlow)" filter="url(#glow)"/>
        <!-- Reflection Overlay -->
        <ellipse cx="80" cy="55" rx="16" ry="7" fill="#ffffff" opacity="0.6" transform="rotate(-30 80 55)"/>
      </svg>
    </div>

    <h1>Happy Birthday! ✨</h1>
    <p>শুভ জন্মদিন! তোমার জীবনের প্রতিটি মুহূর্ত ভরে উঠুক অনেক অনেক ভালোবাসা, আনন্দ আর হাসিখুশিতে! 💖</p>
    
    <button class="btn" onclick="alert('Sending Lots of Love & Wishes! 🎂🎉')">Make a Wish ✨</button>
  </div>

</body>
</html>
